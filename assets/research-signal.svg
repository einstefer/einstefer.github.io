<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" fill="none" role="img" aria-labelledby="title description">
  <title id="title">An abstract study of EEG signals</title>
  <desc id="description">Layered lilac and white signal traces on a fine dark grid, with a lime accent at a conceptual P300 response. This is an original scientific illustration, not measured research data.</desc>
  <defs>
    <linearGradient id="surface" x1="90" y1="0" x2="810" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1e20"/>
      <stop offset=".56" stop-color="#111314"/>
      <stop offset="1" stop-color="#181b1e"/>
    </linearGradient>
    <radialGradient id="haze" cx="0" cy="0" r="1" gradientTransform="translate(505 258) rotate(90) scale(230 350)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbb7f8" stop-opacity=".1"/>
      <stop offset="1" stop-color="#bbb7f8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="envelope" x1="459" y1="108" x2="459" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbb7f8" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#bbb7f8" stop-opacity=".09"/>
      <stop offset="1" stop-color="#bbb7f8" stop-opacity=".015"/>
    </linearGradient>
    <linearGradient id="signal" x1="65" y1="265" x2="840" y2="265" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bbb7f8" stop-opacity=".2"/>
      <stop offset=".3" stop-color="#bbb7f8"/>
      <stop offset=".58" stop-color="#f2f2e8"/>
      <stop offset=".8" stop-color="#bbb7f8"/>
      <stop offset="1" stop-color="#bbb7f8" stop-opacity=".2"/>
    </linearGradient>
    <pattern id="fine-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" stroke="#f2f2e8" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <pattern id="major-grid" width="110" height="110" patternUnits="userSpaceOnUse">
      <path d="M110 0H0V110" stroke="#bbb7f8" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <linearGradient id="grid-fade" x1="0" y1="70" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white"/>
      <stop offset=".8" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fade"><rect width="900" height="500" fill="url(#grid-fade)"/></mask>
    <clipPath id="plot"><rect x="44" y="82" width="812" height="336"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="900" height="500" rx="4" fill="url(#surface)"/>
  <rect width="900" height="500" fill="url(#haze)"/>
  <g mask="url(#fade)">
    <rect x="44" y="82" width="812" height="336" fill="url(#fine-grid)"/>
    <rect x="44" y="82" width="812" height="336" fill="url(#major-grid)"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.1">
    <text x="48" y="48" fill="#f2f2e8" fill-opacity=".8">SIGNAL / STRUCTURE</text>
    <text x="852" y="48" text-anchor="end" fill="#bbb7f8" fill-opacity=".65">EEG · CONCEPTUAL STUDY</text>
  </g>
  <path d="M48 63H852" stroke="#f2f2e8" stroke-opacity=".08"/>

  <g clip-path="url(#plot)" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#f2f2e8" stroke-opacity=".13" stroke-width="1.1">
      <path d="M44 139C75 140 77 135 91 138S109 144 125 139S143 131 160 136S177 143 191 139S210 134 226 138S243 145 257 140S275 129 291 136S314 150 330 141S352 120 368 136S389 155 405 137S427 104 446 130S467 160 483 138S502 107 519 131S537 148 553 136S577 128 593 137S616 146 637 137S658 131 677 137S694 144 713 138S736 132 753 139S776 145 794 138S820 136 856 139"/>
